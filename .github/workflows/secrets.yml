
name: Test GitHub Actions Secrets

on:
  push:
  workflow_dispatch:

jobs:
  test-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check if secret exists
        env:
          TEST_SECRET: ${{ secrets.MY_TEST_SECRET }}
        run: |
          if [ -n "$TEST_SECRET" ]; then
            echo "SUCCESS: Secret is available!"
          else
            echo "ERROR: Secret is missing or unavailable!"
            exit 1
          fi
