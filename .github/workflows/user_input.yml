
name: Addition of Two Numbers

on:
  workflow_dispatch:
    inputs:
      num1:
        description: "Enter first number"
        required: true
        type: number
      num2:
        description: "Enter second number"
        required: true
        type: number

jobs:
  addition:
    runs-on: ubuntu-latest

    steps:
      - name: Add two numbers
        run: |
          num1=${{ inputs.num1 }}
          num2=${{ inputs.num2 }}
          sum=$((num1 + num2))
          echo "First number: $num1"
          echo "Second number: $num2"
          echo "Sum: $sum"
